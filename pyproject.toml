[project]
name = "pc-mcp"
version = "0.1.0"
description = "Let a remote Claude (e.g. Claude Code in the cloud) run commands, use tools and diagnose problems on this PC over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "psutil>=6.0",
    "pillow>=10.0",
    "uvicorn>=0.31",
]

[project.scripts]
pc-mcp = "pc_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pc_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
